<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - LACT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-slate-800 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-white">⚙️ Dashboard Admin (Kelola User)</h1>
            <div class="flex gap-3">
                <!-- Tombol Pintasan Admin ke Workspace -->
                <a href="index.html" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 shadow-md">
                    <span>📝</span> Buka Workspace LACT
                </a>
                <button id="btn-logout-admin" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition shadow-md">Keluar</button>
            </div>
        </div>

        <div class="p-6 overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 uppercase text-xs">
                        <th class="p-4 rounded-tl-lg">Email Akun</th>
                        <th class="p-4 text-center">Status</th>
                        <th class="p-4 text-center rounded-tr-lg">Aksi / Tindakan</th>
                    </tr>
                </thead>
                <tbody id="admin-user-list">
                    <!-- Data tabel akan disuntik dari Firebase via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- FIREBASE SDK WAJIB -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- SCRIPT ADMIN -->
    <script src="js/admin.js?v=123"></script>
</body>
</html>
