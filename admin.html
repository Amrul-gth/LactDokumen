<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - RevLACT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 h-screen flex flex-col">

    <!-- Header Admin -->
    <header class="bg-red-700 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-wider">🛡️ RevLACT Admin</h1>
            <p class="text-xs text-red-200">Logged in as: kmugtng17@gmail.com</p>
        </div>
        <div class="flex gap-3">
            <button onclick="window.location.href='index.html'" class="bg-white text-red-700 hover:bg-red-50 px-4 py-2 rounded-lg font-bold text-sm shadow transition">
                Masuk ke Aplikasi 👉
            </button>
            <button onclick="logoutAdmin()" class="bg-red-900 hover:bg-red-800 text-white px-4 py-2 rounded-lg font-bold text-sm shadow transition">
                Logout
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-8 max-w-5xl mx-auto w-full">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 border-b pb-2">User Access Control</h2>
            <p class="text-sm text-gray-500 mt-2">Daftar pengguna yang mendaftar. Silakan Approve (Terima) atau Reject (Tolak) akses mereka ke aplikasi utama.</p>
        </div>

        <!-- Tabel User -->
        <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b">
                        <th class="p-4">Email Pengguna</th>
                        <th class="p-4 text-center">Status</th>
                        <th class="p-4 text-center">Aksi / Tindakan</th>
                    </tr>
                </thead>
                <tbody id="admin-user-list" class="divide-y divide-gray-100">
                    <!-- Data user diload via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
